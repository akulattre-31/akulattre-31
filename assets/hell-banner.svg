<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
<defs>
<radialGradient id="bg" cx="50%" cy="100%" r="90%"><stop offset="0" stop-color="#5a0000"/><stop offset=".55" stop-color="#1a0000"/><stop offset="1" stop-color="#0d1117"/></radialGradient>
<linearGradient id="fl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffb300"/><stop offset=".4" stop-color="#ff1a1a"/><stop offset="1" stop-color="#8b0000" stop-opacity="0"/></linearGradient>
<linearGradient id="hn" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2a0000"/><stop offset="1" stop-color="#8b0000"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.f{fill:url(#fl);opacity:.85;transform-box:fill-box;transform-origin:50% 100%;animation:fl 1.2s ease-in-out infinite alternate}
@keyframes fl{0%{transform:scaleY(.7) skewX(-4deg)}100%{transform:scaleY(1.15) skewX(4deg)}}
.e{fill:#ff6a00;animation:up 6s linear infinite}
@keyframes up{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx),-340px);opacity:0}}
.eye{fill:#ff1a1a;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{fill:#8b0000;opacity:.6}50%{fill:#ffdd00;opacity:1}}
.head{animation:breathe 4s ease-in-out infinite;transform-origin:600px 150px}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.t{font:900 64px Impact,'Arial Black',sans-serif;letter-spacing:8px;fill:#ff1a1a;animation:flick 3s infinite}
@keyframes flick{0%,19%,23%,60%,64%,100%{opacity:1}20%,62%{opacity:.35}}
.s{font:600 18px 'Courier New',monospace;letter-spacing:3px;fill:#ffb3b3}
</style>
